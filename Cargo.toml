[package]
name = "sat-rwg-map"
version = "0.1.1"
edition = "2021"
authors = ["Dragon Forge Creations"]
description = "Satisfactory RWG Interactive Map & Save Server"

[dependencies]
byteorder = "1.5"
flate2 = { version = "1.0", features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.10"
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
